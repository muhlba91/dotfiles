---
name: Chezmoi

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    name: Chezmoi

    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8 # v4.0.0
        with:
          repo: twpayne/chezmoi

      - run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - run: .github/scripts/check-chezmoi.sh
        env:
          DESTINATION: ${{ runner.temp }}/home
          SCRATCH: ${{ runner.temp }}/chezmoi
