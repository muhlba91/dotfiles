---
repos:
  - repo: https://github.com/siderolabs/conform
    rev: v0.1.0-alpha.33
    hooks:
      - id: conform
        stages:
          - commit-msg
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck # plain .sh only; .sh.tmpl files are checked in CI after rendering
        exclude: \.zsh$ # shellcheck cannot parse zsh (p10k config)
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.2
    hooks:
      - id: markdownlint-cli2
        language_version: "22.11.0"
  - repo: local
    hooks:
      - id: zsh-syntax
        name: zsh -n
        entry: zsh -c 'for f; do zsh -n "$f" || exit 1; done' --
        language: system
        files: (^|/)dot_(zshrc|zprofile|zshenv)$
      - id: forbidden-paths
        name: forbid secret-like files
        language: fail
        entry: secret-like file must not be committed
        # chezmoi source names: dot_ prefix, private_ for private files; the tracked aws and gnupg config files are excluded below
        files: (secrets\.zsh|\.pem$|\.key$|(^|/)(private_)?id_(rsa|ecdsa|ed25519)|known_hosts|hosts\.yml|(^|/)(private_)?dot_aws/|(^|/)(private_)?dot_kube/|(^|/)(private_)?dot_oci/|(^|/)(private_)?dot_docker/config|(^|/)(private_)?dot_claude\.json|(^|/)(private_)?dot_gnupg/|(^|/)gpg/)
        # tracked config without secrets: aws profile and gnupg agent/gpg/scdaemon settings
        exclude: ^home/private_(dot_aws/private_config|dot_gnupg/private_(gpg-agent|gpg|scdaemon)\.conf)$
